name: Build and deploy launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    env:
      QUICK_PLAY_SERVER_ADDRESS: ${{ secrets.QUICK_PLAY_SERVER_ADDRESS || 'remote.example:25565' }}
      MOD_MANIFEST_URL: ${{ secrets.MOD_MANIFEST_URL || 'https://remote.example/mods.json' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Create CI-only build configuration
        shell: pwsh
        run: |
          $lines = @(
            "QUICK_PLAY_SERVER_ADDRESS=$env:QUICK_PLAY_SERVER_ADDRESS",
            "MOD_MANIFEST_URL=$env:MOD_MANIFEST_URL"
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE ".env"),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: verify
    runs-on: windows-latest
    env:
      QUICK_PLAY_SERVER_ADDRESS: ${{ secrets.QUICK_PLAY_SERVER_ADDRESS }}
      MOD_MANIFEST_URL: ${{ secrets.MOD_MANIFEST_URL }}
      LAUNCHER_RELEASE_BASE_URL: ${{ secrets.LAUNCHER_RELEASE_BASE_URL }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: ${{ runner.os }}-nsis-3.11

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path (Join-Path $nsis "makensis.exe"))) {
            choco install nsis --no-progress -y
          }
          if (!(Test-Path (Join-Path $nsis "makensis.exe"))) {
            throw "NSIS installation was not found."
          }
          $nsis >> $env:GITHUB_PATH

      - name: Validate release configuration and create build environment
        shell: pwsh
        run: |
          $required = @(
            "QUICK_PLAY_SERVER_ADDRESS",
            "MOD_MANIFEST_URL",
            "LAUNCHER_RELEASE_BASE_URL",
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PUBLIC_KEY"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub secret is missing: $name"
            }
          }
          $lines = @(
            "QUICK_PLAY_SERVER_ADDRESS=$env:QUICK_PLAY_SERVER_ADDRESS",
            "MOD_MANIFEST_URL=$env:MOD_MANIFEST_URL"
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE ".env"),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:release

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/1stmay-launcher-*.exe
            src-tauri/target/release/bundle/nsis/1stmay-launcher-*.exe.sig
            src-tauri/target/release/bundle/nsis/manifest.json

  deploy:
    needs: [verify, release]
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      VDS_RELEASE_DIR: ${{ secrets.VDS_RELEASE_DIR }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-release
          path: release

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add server to known hosts
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import ipaddress, os; ipaddress.IPv4Address(os.environ["SERVER_IP"])'
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          scan_result="$(ssh-keyscan -T 10 -H "$SERVER_IP" 2>/dev/null)"
          if [[ -z "$scan_result" ]]; then
            echo "Could not retrieve the SSH host key from SERVER_IP." >&2
            exit 1
          fi
          printf '%s\n' "$scan_result" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release and atomically publish manifest
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_IP:?Missing SERVER_IP secret}"
          : "${VDS_RELEASE_DIR:?Missing VDS_RELEASE_DIR secret}"
          [[ "$VDS_RELEASE_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$VDS_RELEASE_DIR" != *".."* ]]

          version="$(python3 -c 'import json; print(json.load(open("release/manifest.json", encoding="utf-8"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          installer="1stmay-launcher-${version}.exe"
          for file in "release/$installer" "release/$installer.sig" release/manifest.json; do
            if [[ ! -s "$file" ]]; then
              echo "Required release artifact is missing or empty: $file" >&2
              ls -la release >&2
              exit 1
            fi
          done

          remote="root@$SERVER_IP"
          stage="${VDS_RELEASE_DIR}/.launcher-deploy-${GITHUB_RUN_ID}"
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts")
          ssh "${ssh_args[@]}" "$remote" "mkdir -p -- '$VDS_RELEASE_DIR' '$stage'"
          scp "${ssh_args[@]}" \
            "release/$installer" "release/$installer.sig" release/manifest.json \
            "$remote:$stage/"

          ssh "${ssh_args[@]}" "$remote" sh -s -- "$VDS_RELEASE_DIR" "$stage" "$version" <<'REMOTE'
          set -eu
          release_dir=$1
          stage_dir=$2
          version=$3
          installer="1stmay-launcher-${version}.exe"
          trap 'rm -rf -- "$stage_dir"' EXIT

          install -m 0644 "$stage_dir/$installer" "$release_dir/.$installer.new"
          install -m 0644 "$stage_dir/$installer.sig" "$release_dir/.$installer.sig.new"
          mv -f -- "$release_dir/.$installer.new" "$release_dir/$installer"
          mv -f -- "$release_dir/.$installer.sig.new" "$release_dir/$installer.sig"
          install -m 0644 "$stage_dir/manifest.json" "$release_dir/.manifest.json.new"
          mv -f -- "$release_dir/.manifest.json.new" "$release_dir/manifest.json"

          find "$release_dir" -maxdepth 1 -type f \
            \( -name '1stmay-launcher-*.exe' -o -name '1stmay-launcher-*.exe.sig' \) \
            ! -name "$installer" ! -name "$installer.sig" -delete
          REMOTE
